name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile hooks
        run: python -m py_compile hooks/reaction.py hooks/session_start.py hooks/stop.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
